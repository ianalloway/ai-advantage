name: Production smoke

on:
  workflow_dispatch:
  schedule:
    # Hourly — catch stale/broken ESPN lines quickly.
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "netlify/functions/sports-lines.ts"
      - "src/lib/liveSports.ts"
      - "src/lib/oddsValidation.ts"
      - "tests/smoke/**"
      - ".github/workflows/smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production odds smoke
        env:
          SMOKE_BASE_URL: https://aiadvantagesports.com
          SMOKE_MAX_AGE_SECONDS: "900"
        run: npm run test:smoke
