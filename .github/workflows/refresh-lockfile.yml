name: Refresh lockfile

on:
  pull_request:
    branches: [main]

concurrency:
  group: refresh-lockfile-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.head_ref == 'chore/upgrade-typescript-7'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Regenerate package-lock.json
        run: npm install --no-fund --no-audit

      - name: Commit lockfile if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
          else
            git add package-lock.json
            git commit -m "chore: refresh package-lock.json for TypeScript 7"
            git push origin HEAD:${{ github.head_ref }}
          fi
