name: CI

on:
  push:
    branches: [main, 'claude/**', 'devin/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build mode (-b), not `tsc --noEmit`: the root tsconfig is a solution file
      # with `"files": []`, and plain `tsc` does not follow project references —
      # so the old command typechecked zero files and always passed.
      - name: Type check
        run: npx tsc -b --force

      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-output.txt

      - name: Comment lint output on failure
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Lint failed on ${GITHUB_SHA:0:7}:"
            echo
            echo '```'
            cat lint-output.txt
            echo '```'
          } > /tmp/lint-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/lint-comment.md

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
