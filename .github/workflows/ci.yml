name: CI

on:
  push:
    branches: [main, 'claude/**', 'devin/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build mode (-b), not `tsc --noEmit`: the root tsconfig is a solution file
      # with `"files": []`, and plain `tsc` does not follow project references —
      # so the old command typechecked zero files and always passed.
      - name: Type check
        run: npx tsc -b --force

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
